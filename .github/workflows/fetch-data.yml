name: Blort Bot Telemetry Engine Pipeline

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Execute Telemetry Data Fetcher
        run: node scripts/fetch.js

      - name: Commit and Push Updated Telemetry Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "auto: update bankrbot telemetry data payload [skip ci]" || exit 0
          git push
